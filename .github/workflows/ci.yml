name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-ok-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m pylint src tests
  # Aggregat-Gate: ein Pflicht-Check für alle Jobs des Workflows.
  # Eigener Job statt Matrix-Check, weil der Ruleset-Name stabil bleiben muss.
  ci-ok:
    needs: [ci-ok-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless all jobs succeeded
        run: |
          echo "test: ${{ needs.ci-ok-test.result }} "
          [ "${{ needs.ci-ok-test.result }}" = "success" ]
