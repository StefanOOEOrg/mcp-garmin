# Ruff configuration for the whole repository. The rule set is the organization
# guideline (see CONTRIBUTING.md in StefanOOEOrg/.github): every repository uses
# the same select list, so a diff between two repos shows only the target-version.
# Formatting is not enforced here yet; `ruff format` lands as a separate change.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
